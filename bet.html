<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八縣市首長賭盤</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
  /* Layout: scoreboard strip on top, then a ballot-style grid of eight county cards, host panel last. */
  :root {
    --bg: #eef1ef;
    --surface: #ffffff;
    --ink: #14231f;
    --muted: #5d6b66;
    --line: #d5dcd8;
    --accent: #c4342b;
    --accent-ink: #ffffff;
    --good: #1f7a4d;
    --good-bg: #e4f3ea;
    --chip: #f4f6f5;
    --font-display: 'Noto Serif TC', 'Songti TC', serif;
    --font-body: 'Noto Sans TC', -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1816; --surface: #17231f; --ink: #e8efec; --muted: #93a39d; --line: #2a3a35;
      --accent: #ef6a5f; --accent-ink: #1a0b09; --good: #66d197; --good-bg: #17382a; --chip: #1e2d28;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1816; --surface: #17231f; --ink: #e8efec; --muted: #93a39d; --line: #2a3a35;
    --accent: #ef6a5f; --accent-ink: #1a0b09; --good: #66d197; --good-bg: #17382a; --chip: #1e2d28;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 24px 56px; }
  .wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
  h1, h2 { font-family: var(--font-display); text-wrap: balance; }
  h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); font-weight: 900; line-height: 1.2; }
  h2 { font-size: 1.15rem; font-weight: 900; }
  .eyebrow { font-size: .75rem; letter-spacing: .14em; color: var(--accent); font-weight: 700; }
  .sub { color: var(--muted); font-size: .9rem; margin-top: 6px; }
  .banner { padding: 10px 14px; border: 1px solid var(--line); border-left: 4px solid var(--accent); background: var(--surface); border-radius: 6px; font-size: .9rem; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
  .top { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; }
  @media (max-width: 760px) { .top { grid-template-columns: minmax(0, 1fr); } }
  .status { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 99px; background: var(--chip); border: 1px solid var(--line); font-size: .8rem; font-variant-numeric: tabular-nums; }
  .pill.live { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .pill.shut { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .board { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
  .board li { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font-variant-numeric: tabular-nums; }
  .board li.lead { border-color: var(--accent); }
  .board .rk { font-family: var(--font-display); font-weight: 900; color: var(--muted); }
  .board .nm { overflow-wrap: anywhere; }
  .board .sc { font-weight: 700; }
  .empty { color: var(--muted); font-size: .9rem; margin-top: 10px; }
  .me { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  input[type=text] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); min-width: 0; }
  input[type=text]:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #nick { flex: 1 1 140px; }
  button { font: inherit; cursor: pointer; }
  .btn { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font-weight: 700; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; display: grid; gap: 10px; align-content: start; }
  .card header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h3 { font-family: var(--font-display); font-size: 1.2rem; font-weight: 900; }
  .done { font-size: .78rem; color: var(--good); background: var(--good-bg); padding: 2px 8px; border-radius: 99px; font-weight: 700; white-space: nowrap; }
  .opt { width: 100%; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--chip); color: var(--ink); }
  .opt:disabled { cursor: default; }
  .opt .lbl { font-weight: 500; overflow-wrap: anywhere; }
  .opt .cnt { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; }
  .opt .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .opt .bar i { display: block; height: 100%; background: var(--muted); }
  .opt .who { grid-column: 1 / -1; font-size: .78rem; color: var(--muted); overflow-wrap: anywhere; min-height: 1em; }
  .opt.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .opt.on .lbl::before { content: '◉ '; color: var(--accent); }
  .opt.won { background: var(--good-bg); border-color: var(--good); }
  .opt.won .lbl::after { content: ' ✓'; color: var(--good); font-weight: 700; }
  .opt.won .bar i { background: var(--good); }
  .host { display: grid; gap: 10px; margin-top: 12px; }
  .host-row { display: grid; grid-template-columns: 5rem minmax(0, 1fr) minmax(7rem, 10rem); gap: 8px; align-items: center; }
  @media (max-width: 560px) { .host-row { grid-template-columns: minmax(0, 1fr); } }
  select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); min-width: 0; }
  .cap { font-size: .72rem; color: var(--muted); letter-spacing: .08em; }
</style>
</head>
<body>

<div class="wrap">
  <div>
    <div class="eyebrow">2026 地方公職人員選舉 · 11 月 28 日投票</div>
    <h1>八縣市首長賭盤</h1>
    <p class="sub">六都加新竹縣、新竹市。每個縣市猜誰當選,猜對一個得 1 分。朋友之間玩玩,不涉金錢。</p>
  </div>

  <div id="banner" class="banner" hidden></div>

  <div class="top">
    <section class="panel">
      <h2>我的下注</h2>
      <div class="me">
        <input type="text" id="nick" placeholder="你的暱稱" maxlength="16" autocomplete="off">
        <button class="btn" id="saveNick" type="button">儲存暱稱</button>
      </div>
      <div class="status" id="status"></div>
      <p class="empty" id="hint">先輸入暱稱,再到下方各縣市點選你猜的當選人。再點一次可取消。</p>
    </section>
    <section class="panel">
      <h2>排行榜</h2>
      <ol class="board" id="board"></ol>
    </section>
  </div>

  <div class="cards" id="cards"></div>

  <section class="panel" id="hostPanel">
    <h2>莊家設定</h2>
    <p class="sub">可改各縣市選項、填開票結果、提前封盤。需要莊家密碼。</p>
    <div class="me"><input type="text" id="hostKey" placeholder="莊家密碼" autocomplete="off"><button class="btn" id="hostLogin" type="button">登入</button></div>
    <div class="host" id="host"></div>
    <div class="me" id="lockRow" hidden>
      <button class="btn ghost" id="lockBtn" type="button"></button>
    </div>
  </section>
</div>

<script>
  // 貼上 Apps Script 部署後的網址(結尾 /exec),見 apps-script/Code.gs 開頭說明
  var API_URL = '';

  var COUNTIES = ['臺北市', '新北市', '桃園市', '臺中市', '臺南市', '高雄市', '新竹縣', '新竹市'];
  var DEFAULT_OPTS = ['國民黨', '民進黨', '民眾黨', '其他'];
  var LOCK_AT = new Date('2026-11-28T08:00:00+08:00').getTime();

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]; }); };
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }

  var token = store('bet_token');
  if (!token) { token = (self.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); store('bet_token', token); }
  var myName = store('bet_name') || '';
  var hostKey = store('bet_hostkey') || '';
  var hostOn = false;

  var S = { config: { opts: {}, results: {}, locked: false }, picks: {} };
  var queue = Promise.resolve();

  function optsOf(c) { var o = S.config.opts && S.config.opts[c]; return o && o.length ? o : DEFAULT_OPTS; }
  function isLocked() { return !!S.config.locked || Date.now() >= LOCK_AT; }
  function myDoc() { return S.picks[myName] || { name: myName, picks: {} }; }
  function showBanner(msg) { var b = $('banner'); b.textContent = msg; b.hidden = !msg; }
  function canBet() { return !!API_URL && !isLocked(); }

  function api(params) {
    var u = new URL(API_URL);
    Object.keys(params).forEach(function (k) { u.searchParams.set(k, typeof params[k] === 'string' ? params[k] : JSON.stringify(params[k])); });
    return fetch(u.toString()).then(function (r) { return r.json(); });
  }
  var ERR = { locked: '已封盤,不能再改。', name_taken: '這個暱稱已被別人用了,請換一個。', bad_key: '莊家密碼不對。', bad_request: '資料格式不對。' };
  function enqueue(fn) {
    queue = queue.then(fn).then(function (res) {
      return load().then(function () {
        if (res && res.error) showBanner(ERR[res.error] || ('失敗:' + res.error));
      });
    }).catch(function () { showBanner('連線失敗,請稍後再試。'); });
  }

  function load() {
    if (!API_URL) return Promise.resolve();
    return api({ a: 'state' }).then(function (d) {
      if (d.error) throw new Error(d.error);
      S.config = { opts: d.config.opts || {}, results: d.config.results || {}, locked: !!d.config.locked };
      var m = {}; d.picks.forEach(function (p) { m[p.name] = p; }); S.picks = m;
      showBanner('');
      render();
    }).catch(function () { showBanner('讀取資料失敗,請重新整理。'); });
  }

  function score(p) {
    var r = S.config.results || {}, n = 0;
    COUNTIES.forEach(function (c) { if (r[c] && p.picks && p.picks[c] === r[c]) n++; });
    return n;
  }
  function players() { return Object.keys(S.picks).map(function (k) { return S.picks[k]; }); }

  function savePick(c, o) {
    if (!canBet()) return;
    if (!myName) { $('nick').focus(); $('hint').textContent = '請先輸入暱稱並按「儲存暱稱」。'; return; }
    var picks = Object.assign({}, myDoc().picks);
    if (picks[c] === o) delete picks[c]; else picks[c] = o;
    S.picks[myName] = { name: myName, picks: picks }; render();
    enqueue(function () { return api({ a: 'pick', name: myName, token: token, picks: picks }); });
  }
  function saveNick() {
    var name = $('nick').value.trim();
    if (!name || !canBet()) return;
    if (name === myName) return;
    var old = myName, picks = old ? Object.assign({}, myDoc().picks) : {};
    enqueue(function () {
      return api({ a: 'pick', name: name, token: token, picks: picks }).then(function (res) {
        if (res && res.ok) { myName = name; store('bet_name', name); $('hint').textContent = '暱稱已儲存。'; }
        return res;
      });
    });
  }
  function saveConfig(patch) {
    if (!hostOn) return;
    var cfg = Object.assign({ opts: {}, results: {}, locked: false }, S.config, patch);
    S.config = cfg;
    enqueue(function () { return api({ a: 'config', key: hostKey, config: cfg }); });
  }
  function hostLogin() {
    var k = $('hostKey').value.trim() || hostKey;
    if (!k) return;
    // 用目前設定原樣寫回一次來驗證密碼
    api({ a: 'config', key: k, config: S.config }).then(function (res) {
      if (res.error) { showBanner(ERR[res.error] || res.error); return; }
      hostKey = k; hostOn = true; store('bet_hostkey', k); showBanner(''); render();
    }).catch(function () { showBanner('連線失敗,請稍後再試。'); });
  }

  function render() {
    var locked = isLocked(), ps = players();
    var nick = $('nick');
    if (document.activeElement !== nick) nick.value = myName || nick.value;
    nick.disabled = $('saveNick').disabled = !canBet();

    $('status').innerHTML =
      '<span class="pill ' + (locked ? 'shut' : 'live') + '">' + (locked ? '已封盤' : '開放下注中') + '</span>' +
      '<span class="pill">' + ps.length + ' 人下注</span>';

    var ranked = ps.slice().sort(function (a, b) { return score(b) - score(a) || a.name.localeCompare(b.name, 'zh-Hant'); });
    var decided = COUNTIES.filter(function (c) { return (S.config.results || {})[c]; }).length;
    $('board').innerHTML = ranked.length
      ? ranked.map(function (p, i) {
          return '<li class="' + (i === 0 && decided ? 'lead' : '') + '"><span class="rk">' + (i + 1) + '</span><span class="nm">' + esc(p.name) +
            (p.name === myName ? '(你)' : '') + '</span><span class="sc">' + score(p) + ' / ' + decided + '</span></li>';
        }).join('')
      : '<li><span></span><span class="nm" style="color:var(--muted)">還沒有人下注。你可以當第一個。</span><span></span></li>';

    var mine = myDoc().picks || {};
    $('cards').innerHTML = COUNTIES.map(function (c) {
      var res = (S.config.results || {})[c], total = ps.filter(function (p) { return p.picks && p.picks[c]; }).length;
      var rows = optsOf(c).map(function (o) {
        var who = ps.filter(function (p) { return p.picks && p.picks[c] === o; });
        var pct = total ? Math.round(who.length / total * 100) : 0;
        return '<button type="button" class="opt' + (mine[c] === o ? ' on' : '') + (res === o ? ' won' : '') + '" data-c="' + esc(c) + '" data-o="' + esc(o) + '"' + (canBet() ? '' : ' disabled') + '>' +
          '<span class="lbl">' + esc(o) + '</span><span class="cnt">' + who.length + ' 人</span>' +
          '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
          '<span class="who">' + who.map(function (p) { return esc(p.name); }).join('、') + '</span></button>';
      }).join('');
      return '<article class="card"><header><h3>' + esc(c) + '</h3>' + (res ? '<span class="done">已開票:' + esc(res) + '</span>' : '<span class="cap">' + total + ' 人已選</span>') + '</header>' + rows + '</article>';
    }).join('');

    $('lockRow').hidden = !hostOn;
    $('hostKey').parentNode.hidden = hostOn;
    if (hostOn) {
      $('lockBtn').textContent = S.config.locked ? '解除封盤' : '提前封盤';
      var host = $('host');
      if (!host.contains(document.activeElement)) {
        host.innerHTML = COUNTIES.map(function (c, i) {
          var cur = (S.config.results || {})[c] || '';
          var opts = '<option value="">尚未開票</option>' + optsOf(c).map(function (o) { return '<option' + (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('');
          return '<div class="host-row"><strong>' + esc(c) + '</strong>' +
            '<input type="text" id="opt' + i + '" data-opt="' + esc(c) + '" value="' + esc(optsOf(c).join(',')) + '" aria-label="' + esc(c) + ' 選項">' +
            '<select id="res' + i + '" data-res="' + esc(c) + '" aria-label="' + esc(c) + ' 開票結果">' + opts + '</select></div>';
        }).join('');
      }
    } else {
      $('host').innerHTML = '';
    }
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.opt');
    if (b) savePick(b.dataset.c, b.dataset.o);
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.res) {
      var r = Object.assign({}, S.config.results); if (t.value) r[t.dataset.res] = t.value; else delete r[t.dataset.res];
      saveConfig({ results: r });
    } else if (t.dataset.opt) {
      var list = t.value.split(/[,,、]/).map(function (s) { return s.trim(); }).filter(Boolean);
      if (list.length >= 2) { var o = Object.assign({}, S.config.opts); o[t.dataset.opt] = list; saveConfig({ opts: o }); }
    }
  });
  $('saveNick').addEventListener('click', saveNick);
  $('nick').addEventListener('keydown', function (e) { if (e.key === 'Enter') saveNick(); });
  $('hostLogin').addEventListener('click', hostLogin);
  $('hostKey').addEventListener('keydown', function (e) { if (e.key === 'Enter') hostLogin(); });
  $('lockBtn').addEventListener('click', function () { saveConfig({ locked: !S.config.locked }); });

  render();
  if (!API_URL) showBanner('還沒設定後端網址。請依 apps-script/Code.gs 開頭的步驟部署,再把網址貼到 bet.html 的 API_URL。');
  else {
    load();
    setInterval(function () { if (!document.hidden) load(); }, 15000);
  }
</script>
</body>
</html>
